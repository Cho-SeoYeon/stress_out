<style>
:root{--ink:#263229;--muted:#647066;--sage:#536b5a;--cream:#fff9da;--line:#d7decf;--shadow:0 18px 45px rgba(47,64,51,.18)}*{box-sizing:border-box}html,body{margin:0;min-height:100%}button{font:inherit}body{min-width:320px;background:radial-gradient(circle at 80% 0,#fff6bf 0,transparent 34%),#edf1e7;color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}.shell{width:min(1180px,100%);margin:auto;padding:24px 18px 40px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:15px}.brand{display:flex;align-items:center;gap:12px}.logo{width:45px;height:45px;border-radius:13px;display:grid;place-items:center;background:var(--sage);color:var(--cream);font-size:24px;box-shadow:4px 4px 0 #c8d3bc}.brand strong{display:block;font-size:20px}.brand small{color:var(--muted)}.status-pill{padding:9px 12px;border:1px solid #cbd7c5;border-radius:999px;background:#fbfdf6;color:#48604d;font-weight:800;font-size:12px}.stage-card{background:#304039;border-radius:22px;padding:10px;box-shadow:var(--shadow)}.stage-head{height:38px;padding:0 11px;display:flex;align-items:center;justify-content:space-between;color:#edf2e8;font-weight:800;font-size:12px;letter-spacing:.04em}.live{display:flex;align-items:center;gap:7px;color:#f8edaa}.live:before{content:"";width:8px;height:8px;border-radius:50%;background:#f5d85e;box-shadow:0 0 12px #f5d85e}.stage{position:relative;overflow:hidden;border-radius:13px;aspect-ratio:1024/578;background:#e9dfbf}.office{width:100%;height:100%;display:block;object-fit:cover;user-select:none}.stage:after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5);pointer-events:none}.person{position:absolute;width:7%;aspect-ratio:1/2;background:url("people.png") var(--sprite,0%) 0/600% 100% no-repeat;image-rendering:pixelated;transform:translate(-50%,-100%) scale(var(--scale,.86));transform-origin:bottom center;filter:drop-shadow(0 4px 2px rgba(28,35,29,.3));z-index:4}.me{left:47%;top:72%;--sprite:20%;--scale:.86;background-image:url("me.png")}.visitor{left:108%;top:72%;--sprite:0%;transition:left 2.5s steps(22,end),top 2.5s steps(22,end)}.idle-person{z-index:3;transition:opacity .2s ease}.idle-person.away{opacity:0}.idle-person.sitting{transform:translate(-50%,-100%) scale(var(--scale,.78)) scaleY(.82)}.visitor.walking{animation:bob .38s ease-in-out infinite}.visitor.touchy{animation:touchy 1.25s ease-in-out infinite}@keyframes bob{50%{margin-top:-5px;transform:translate(-50%,-100%) scale(var(--scale,.86)) rotate(1.5deg)}}@keyframes touchy{0%,100%{margin-left:0;transform:translate(-50%,-100%) scale(var(--scale,.86))}35%{margin-left:-18px;transform:translate(-50%,-101%) scale(var(--scale,.86)) rotate(-3deg)}65%{margin-left:-8px;transform:translate(-50%,-100%) scale(var(--scale,.86)) rotate(2deg)}}.bubble{position:absolute;width:max-content;max-width:230px;padding:9px 12px;border:2px solid #344238;border-radius:12px;background:#fffdf0;color:#29332c;font-weight:900;font-size:clamp(11px,1.45vw,17px);line-height:1.4;text-align:center;white-space:normal;box-shadow:3px 4px 0 rgba(33,46,37,.22);z-index:9;opacity:0;transform:translate(-50%,-8px) scale(.9);transition:.22s}.bubble.show{opacity:1;transform:translate(-50%,-8px) scale(1)}.bubble:after{content:"";position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);border:9px solid transparent;border-top-color:#344238;border-bottom:0}.visitor-bubble{left:50%;bottom:100%}.me-bubble{left:47%;top:55%;transform:translate(-50%,-100%) scale(.9)}.me-bubble.show{transform:translate(-50%,-100%) scale(1)}

or:var(--sage);color:white}.actions .magic{background:#fff4b7;border-color:#daca71;color:#574d1f}.hint{margin:11px 5px 0;color:var(--muted);font-size:12px}.sound-note{font-weight:800;color:#657967}@media(max-width:720px){.shell{padding:12px 8px 28px}.top{padding:3px 5px}.brand small,.status-pill{display:none}.stage-card{padding:6px;border-radius:15px}.stage-head{height:32px}.person{width:9%}.bubble{max-width:170px;font-size:11px;padding:6px 8px}.controls{grid-template-columns:1fr;padding:13px}.actions{justify-content:flex-start;flex-wrap:wrap}.photo-card{width:min(260px,52%);padding:5px;border-width:2px;border-radius:12px}.photo-card img{border-radius:7px}.me-bubble{top:53%}}@media(prefers-reduced-motion:reduce){.visitor.walking{animation:none}.reveal.show{animation:none;opacity:1}.reveal.show .spark{animation:none;opacity:1}}

:root{--ink:#102a46;--muted:#58718a;--sage:#1e436b;--cream:#f2f0ce;--line:#91a6aa;--shadow:6px 6px 0 rgba(17,45,74,.22)}
body{background-color:#f2f0ce;background-image:linear-gradient(rgba(30,67,107,.075) 1px,transparent 1px),linear-gradient(90deg,rgba(30,67,107,.075) 1px,transparent 1px);background-size:22px 22px;color:var(--ink);font-family:"Cascadia Mono","Consolas","Malgun Gothic",monospace}

</style></head><body><main class="shell"><header class="top"><div class="brand"><div class="logo">⌨</div><div><strong>말 대신 사진으로 답하는 사무실</strong><small>LOCAL://OFFICE_RESPONSE</small></div></div><div class="status-pill">[ SYSTEM ONLINE ]</div></header><section class="stage-card" aria-label="픽셀 사무실 장면"><div class="stage-head"><span class="live">OFFICE_STREAM // NODE-01</span><span id="clock">09:00</span></div><div class="stage" id="stage"><img class="office" src="office.png" alt="픽셀아트 사무실"><div id="idleCast" aria-hidden="true"></div><div class="person me" aria-label="모자를 쓴 나"></div><div class="bubble me-bubble" id="meBubble">네?</div><div class="person visitor" id="visitor"><div class="bubble visitor-bubble" id="visitorBubble"></div></div><div class="reveal" id="reveal"><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><i class="spark s4"></i><article class="photo-card" role="dialog" aria-modal="true" aria-label="속마음 사진"><button class="close-photo" id="closePhoto" type="button" aria-label="사진 닫기">×</button><img id="answerImage" src="ai.jpg" alt="마음속 답변 이미지"></article></div></div><p class="caption" id="caption" aria-live="polite">첫 번째 동료가 오는 중...</p></section><section class="controls"><div><div class="visitors" id="visitors"></div><p class="hint">동료를 고르거나 자동 재생으로 지켜보세요. <span class="sound-note">🔊 첫 클릭 이후 샤랄라 소리가 재생돼요.</span></p></div><div class="actions"><button class="primary" id="play" type="button">Ⅱ PAUSE</button><button id="next" type="button">NEXT_NODE →</button><button class="magic" id="magic" type="button">✦ OPEN_RESPONSE</button></div></section></main>
<script>(()=>{'use strict';const people=[
{name:'걍 하면 돼요 남',sprite:0,ask:'어 ㅋㅋ 아 이거 그냥 이렇게 이렇게 하면 돼요 걍',reply:'근데 확인은 안 해주세요?',image:'ai.jpg',start:{x:14,y:74,scale:.72}},
{name:'나때는말이야충',sprite:20,ask:'서연씨, 나 때는 말이야~',reply:'…나랑 동갑인데 미친놈이',image:'fuckyou.png',touchy:true,start:{x:84,y:70,scale:.7,sitting:true}},
{name:'본부장님',sprite:40,ask:'주말 출근, 그거 꼭 해야 돼? 집에서 응대해도 되잖아?',reply:'아… 네, 본부장님.',image:'oldman.jpg',start:{x:92,y:82,scale:.7}},
{name:'주말카톡 과장',sprite:60,ask:'주말에 카톡하는 것도 업무의 연장이야 ㅋㅋ',reply:'아, 그러시구나…',image:'water.jpg',start:{x:29,y:66,scale:.68}},
{name:'대체휴가 선배',sprite:80,ask:'나는 우리 프로젝트 하면서 대체휴가 다 써본 적이 없어~',reply:'네… 그러셨군요.',image:'quiet.jpg',start:{x:74,y:84,scale:.72,sitting:true}},
{name:'지사장님',sprite:100,ask:'서연아~',reply:'…네, 지사장님?',image:'run.jpg',start:{x:64,y:69,scale:.72}}
];
const visitor=document.getElementById('visitor'),vBubble=document.getElementById('visitorBubble'),meBubble=document.getElementById('meBubble'),reveal=document.getElementById('reveal'),answerImage=document.getElementById('answerImage'),caption=document.getElementById('caption'),buttons=document.getElementById('visitors'),play=document.getElementById('play'),idleCast=document.getElementById('idleCast'),closePhoto=document.getElementById('closePhoto');
const idlePeople=people.map((p,i)=>{const el=document.createElement('div');el.className='person idle-person'+(p.start.sitting?' sitting':'');el.style.left=p.start.x+'%';el.style.top=p.start.y+'%';el.style.setProperty('--sprite',p.sprite+'%');el.style.setProperty('--scale',p.start.scale);el.setAttribute('aria-label',p.name+' 대기 중');idleCast.appendChild(el);return el});
let index=-1,phase=0,elapsed=0,playing=true,photoOpen=false,audio=null,last=performance.now();
function chime(){audio??=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const now=audio.currentTime;[659.25,783.99,987.77,1318.51].forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=i%2?'sine':'triangle';o.frequency.setValueAtTime(f,now+i*.095);g.gain.setValueAtTime(0,now+i*.095);g.gain.linearRampToValueAtTime(.11,now+i*.095+.025);g.gain.exponentialRampToValueAtTime(.001,now+i*.095+.72);o.connect(g).connect(audio.destination);o.start(now+i*.095);o.stop(now+i*.095+.75)})}
function select(i){index=i;phase=0;elapsed=0;const p=people[i];photoOpen=false;reveal.classList.remove('show');meBubble.classList.remove('show');vBubble.classList.remove('show');idlePeople.forEach((el,n)=>el.classList.toggle('away',n===i));visitor.style.setProperty('--sprite',p.sprite+'%');visitor.style.setProperty('--scale',p.start.scale);visitor.style.left=p.start.x+'%';visitor.style.top=p.start.y+'%';visitor.classList.remove('touchy');visitor.classList.add('walking');[...buttons.children].forEach((b,n)=>b.setAttribute('aria-pressed',String(n===i)));caption.textContent=p.name+'이(가) 자리에서 일어나는 중...';requestAnimationFrame(()=>requestAnimationFrame(()=>{visitor.style.left='59%';visitor.style.top='72%'}))}
function setPhase(n){phase=n;elapsed=0;const p=people[index];if(n===1){visitor.classList.remove('walking');vBubble.textContent=p.ask;vBubble.classList.add('show');caption.textContent=p.name+' · '+p.ask}else if(n===2){meBubble.textContent=p.reply;meBubble.classList.add('show');if(p.touchy)visitor.classList.add('touchy');caption.textContent=p.touchy?'팔뚝 만짐 · 얼굴 찌름 · 어깨 토닥이는 중':'나 · '+p.reply}else if(n===3){visitor.classList.remove('touchy');showPhoto()}else if(n===4){reveal.classList.remove('show');vBubble.classList.remove('show');meBubble.classList.remove('show');visitor.classList.remove('touchy');visitor.classList.add('walking');visitor.style.left=p.start.x+'%';visitor.style.top=p.start.y+'%';caption.textContent=p.name+'이(가) 원래 자리로 돌아가는 중...'}else if(n===5){idlePeople[index].classList.remove('away');select((index+1)%people.length)}}
function showPhoto(){const p=people[index<0?0:index];answerImage.src=p.image;photoOpen=true;reveal.classList.remove('show');void reveal.offsetWidth;reveal.classList.add('show');closePhoto.focus();caption.textContent='RESPONSE_WINDOW // 닫기 버튼을 눌러 계속';chime()}function closeResponse(){if(!photoOpen)return;photoOpen=false;reveal.classList.remove('show');if(phase===3)setPhase(4)}
function frame(now){const dt=Math.min(100,now-last);last=now;if(playing&&index>=0){elapsed+=dt;if(phase===0&&elapsed>3200)setPhase(1);else if(phase===1&&elapsed>4600)setPhase(2);else if(phase===2&&elapsed>3600)setPhase(3);else if(phase===4&&elapsed>3000)setPhase(5)}requestAnimationFrame(frame)}
people.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.textContent=p.name;b.setAttribute('aria-pressed','false');b.onclick=()=>{playing=true;play.textContent='Ⅱ PAUSE';select(i)};buttons.appendChild(b)});
play.onclick=()=>{playing=!playing;play.textContent=playing?'Ⅱ PAUSE':'▶ 재생하기';if(playing)audio??=new(window.AudioContext||window.webkitAudioContext)()};document.getElementById('next').onclick=()=>select((index+1+people.length)%people.length);document.getElementById('magic').onclick=showPhoto;closePhoto.onclick=closeResponse;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&photoOpen)closeResponse()});document.addEventListener('pointerdown',()=>{audio??=new(window.AudioContext||window.webkitAudioContext)()},{once:true});setInterval(()=>{document.getElementById('clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})},1000);caption.textContent='사무실에 모두 대기 중 · 인물을 선택하면 네 자리로 옵니다';requestAnimationFrame(frame)
})();</script></body></html>
